<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Shept</title>
  <desc>A face with a finger raised to its lips: whisper.</desc>
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
  </defs>
  <!-- Head -->
  <ellipse cx="66" cy="48" rx="34" ry="37" fill="url(#head)"/>
  <!-- Closed eyes and lips: the face is relaxed, not talking -->
  <g fill="none" stroke="#123a6b" stroke-width="6" stroke-linecap="round">
    <path d="M46 39 q7 6 14 0"/>
    <path d="M76 39 q7 6 14 0"/>
    <path d="M74 66 q9 5 18 0"/>
  </g>
  <!-- One hand: the index finger across the lips, the rest folded below -->
  <g fill="#a8cdf5">
    <rect x="33" y="83" width="33" height="27" rx="13.5"/>
    <rect x="50" y="47" width="14" height="47" rx="7"
          transform="rotate(-30 57 70)"/>
  </g>
</svg>
