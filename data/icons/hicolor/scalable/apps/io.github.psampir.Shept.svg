<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Shept</title>
  <g id="shept-icon">
    <!-- Pen nib: a teardrop pointing down, with the vent hole and the slit
         cut out of the same path (even-odd fill). -->
    <path id="nib" fill="#3584e4" fill-rule="evenodd"
          d="M48 104 C56 91 68 77 68 58 A20 20 0 0 0 28 58 C28 77 40 91 48 104 Z
             M46 68 h4 v24 h-4 Z
             M48 60 m-6 0 a6 6 0 1 0 12 0 a6 6 0 1 0 -12 0 Z"/>
    <!-- Three short sound waves leaving the nib. -->
    <g id="waves" fill="none" stroke="#99c1f1" stroke-width="6" stroke-linecap="round">
      <path d="M80 56 A11 11 0 0 1 80 72"/>
      <path d="M88 47.5 A22 22 0 0 1 88 80.5"/>
      <path d="M96 39 A33 33 0 0 1 96 89"/>
    </g>
  </g>
</svg>
