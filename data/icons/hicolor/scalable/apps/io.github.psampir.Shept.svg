<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Shept</title>
  <desc>A head in profile with a hand raised to its mouth: whisper.</desc>
  <defs>
    <linearGradient id="hpC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
  </defs>
  <!-- Head in profile, facing right -->
  <path fill="url(#hpC)"
        d="M54 16
           C72 12 88 20 91 32
           C93 38 92 43 94 46
           L102 50
           C106 54 107 58 104 61
           C102 63 99 63 96 62
           C99 65 100 68 96 71
           C98 74 97 78 92 80
           C92 87 86 91 78 92
           L76 118
           L50 118
           L50 100
           C40 92 32 76 32 60
           C32 38 40 22 54 16 Z"/>
  <!-- Closed eye -->
  <path fill="none" stroke="#123a6b" stroke-width="5" stroke-linecap="round"
        d="M72 46 q8 5 13 1"/>
  <!-- The same hand as before, turned through 180 degrees -->
  <g transform="rotate(180 105 80.5)">
    <g fill="#a8cdf5" transform="rotate(-20 99 78)">
      <rect x="102" y="65" width="18" height="30" rx="9"/>
      <rect x="90" y="66" width="24" height="8" rx="4"/>
      <rect x="90" y="77" width="24" height="8" rx="4"/>
      <rect x="91" y="88" width="23" height="8" rx="4"/>
    </g>
  </g>
</svg>
