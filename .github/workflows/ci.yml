name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.4"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # GTK/PyGObject is deliberately not installed: the suite must stay clean
      # of `gi` imports, and this job proves it on every run.
      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: shept-wheel
          path: dist/*.whl

  flatpak:
    name: Flatpak bundle
    # The bundle is what most users install, so the manifest has to be exercised
    # on every change that can affect it, but a cold build of whisper.cpp and
    # ffmpeg is ~20 min, so pull requests to dev are left to the fast jobs.
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: shept.flatpak
          manifest-path: build-aux/io.github.psampir.Shept.yml
          cache-key: flatpak-${{ hashFiles('build-aux/io.github.psampir.Shept.yml') }}
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: shept-flatpak
          path: shept.flatpak
          if-no-files-found: error
