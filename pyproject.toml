[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shept"
version = "0.2.0"
description = "Local speech-to-text for your desktop, powered by whisper.cpp"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Paweł Sampir", email = "pawel.sampir@gmail.com" },
]
keywords = ["whisper", "speech-to-text", "transcription", "gtk4", "libadwaita"]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    # No "License :: OSI Approved :: MIT License" classifier: PEP 639 supersedes
    # it with the SPDX `license` expression above, and setuptools >= 77 refuses
    # to build if both are present.
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# PyGObject (the `gi` module) is deliberately not declared as a runtime
# dependency: it is provided by the system (python3-gobject / python-gi) and
# installing it from PyPI requires a full GTK build toolchain. See the
# Requirements section of the README.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/psampir/shept"
Issues = "https://github.com/psampir/shept/issues"

[project.scripts]
shept = "shept.app:main"

[tool.setuptools.packages.find]
include = ["shept*"]

# Installed next to the package so `pip install --user` also creates the
# launcher and the icon: without them a wheel install is only reachable from a
# terminal. Relative paths land under the install prefix (for --user that is
# ~/.local).
[tool.setuptools.data-files]
"share/applications" = ["data/io.github.psampir.Shept.desktop"]
"share/icons/hicolor/scalable/apps" = [
    "data/icons/hicolor/scalable/apps/io.github.psampir.Shept.svg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
